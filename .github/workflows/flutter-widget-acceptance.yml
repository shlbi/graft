name: Flutter widget and host acceptance

on:
  workflow_dispatch:
  push:
    branches: [repot/flutter-widget-acceptance-20261004]

permissions:
  contents: read
concurrency:
  group: flutter-widget-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authored-widgets:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      FLUTTER_REVISION: 5fc346839b5d0eef006ed8404392afb4dfae428d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install repository dependencies without lifecycle scripts
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: New widget harness and real core regression tests
        run: |
          node --test scripts/flutter-widget-*.test.mjs
          node --experimental-vm-modules --test web/test/flutter-widget-core.test.mjs
      - name: Retained SDK harness, native, platform and repair regressions
        run: |
          node --test scripts/verify-dart-fixture.test.mjs
          npm run test:dart
          npm run test:platforms
          npm run test:repairs
      - name: Resolve pinned official SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            --output "$RUNNER_TEMP/flutter-releases.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          records = json.loads((Path(os.environ['RUNNER_TEMP']) / 'flutter-releases.json').read_text())
          release = next(r for r in records['releases'] if r['hash'] == os.environ['FLUTTER_REVISION'] and r['channel'] == 'stable' and r.get('dart_sdk_arch', 'x64') == 'x64')
          archive, digest = release['archive'], release['sha256']
          if not re.fullmatch(r'stable/linux/flutter_linux_[A-Za-z0-9_.-]+\.tar\.xz', archive):
              raise SystemExit('Unexpected official SDK archive path')
          if not re.fullmatch(r'[a-f0-9]{64}', digest):
              raise SystemExit('Missing official SDK checksum')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'FLUTTER_ARCHIVE={archive}\nFLUTTER_SHA256={digest}\n')
          print(json.dumps({'sdkRevision': release['hash'], 'version': release['version'], 'sha256': digest}))
          PY
      - name: Install checksum-verified official SDK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            "https://storage.googleapis.com/flutter_infra_release/releases/$FLUTTER_ARCHIVE" \
            --output "$RUNNER_TEMP/flutter-sdk.tar.xz"
          printf '%s  %s\n' "$FLUTTER_SHA256" "$RUNNER_TEMP/flutter-sdk.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/flutter-sdk.tar.xz" -C "$RUNNER_TEMP"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Real Flutter widget, host and negative-control acceptance
        run: node scripts/verify-flutter-widget-fixture.mjs "$RUNNER_TEMP/repot-widget-acceptance" --execute
      - name: Summarize observed evidence without artifact storage
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'repot-widget-acceptance/widget-sdk-acceptance.json'
          lines = ['# Authored Flutter widget acceptance', '', f"Commit: `{os.environ['GITHUB_SHA']}`", '']
          if not p.exists():
              lines.append('No widget SDK report: execution not established.')
          else:
              r = json.loads(p.read_text())
              lines += [f"Overall: **{r['status']}**", '', '| Package | Analysis | Evidence | Passed tests | Expected assertion failures |', '|---|---|---|---|---|']
              for item in r['packages']:
                  evidence = item.get('evidence', {})
                  lines.append(f"| {item['name']} | {item.get('analysis', {}).get('status', 'not_run')} | {evidence.get('status', 'not_run')} | {len(evidence.get('passedTests', []))} | {len(evidence.get('assertionFailures', []))} |")
              lines += ['', f"Preservation: {r['preservation']}", f"Verification: {r['verification']}"]
          lines += ['', 'Authored fixtures only. Host probes and negative controls are not in the transfer patch. No device, native build, paid AI, customer repository, production database, or production credentials used.']
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text)
          PY
